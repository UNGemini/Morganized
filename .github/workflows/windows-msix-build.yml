name: Windows MSIX build
on:
  push:
    branches: [store/msix-v1.0.0]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Windows executable
        run: npx --yes @tauri-apps/cli@2.11.2 build --no-bundle
      - name: Pack MSIX for Store submission
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path msix-layout/Assets | Out-Null
          Copy-Item msix/AppxManifest.xml msix-layout/AppxManifest.xml
          Copy-Item msix/Assets/*.png msix-layout/Assets/
          Copy-Item src-tauri/target/release/Morganized.exe msix-layout/Morganized.exe
          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $makeappx) { throw "Windows SDK MakeAppx.exe not found" }
          & $makeappx.FullName pack /d msix-layout /p Morganized_1.0.0.0_x64.msix
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: morganized-msix-store-x64
          path: Morganized_1.0.0.0_x64.msix
          if-no-files-found: error
