name: Windows MSIX and Microsoft Store
on:
  push:
    branches: [main, store/github-updates]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Submit this version to Microsoft Store
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: morganized-store-${{ github.event_name == 'push' && github.ref || 'submission' }}
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.package-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate release version and prepare manifest
        id: package-version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          STORE_PUBLISH: ${{ github.event_name == 'release' || inputs.publish == true }}
        run: node scripts/prepare-msix.mjs
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Windows executable
        run: npx --yes @tauri-apps/cli@2.11.2 build --no-bundle -- --locked
      - name: Pack MSIX for Store submission
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path msix-layout/Assets | Out-Null
          Copy-Item msix/AppxManifest.xml msix-layout/AppxManifest.xml
          Copy-Item msix/Assets/*.png msix-layout/Assets/
          Copy-Item src-tauri/target/release/Morganized.exe msix-layout/Morganized.exe
          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $makeappx) { throw "Windows SDK MakeAppx.exe not found" }
          & $makeappx.FullName pack /d msix-layout /p "Morganized_${{ steps.package-version.outputs.version }}.0_x64.msix"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: morganized-msix-${{ steps.package-version.outputs.version }}-x64
          path: Morganized_*.msix
          if-no-files-found: error
  publish:
    needs: build
    if: github.event_name == 'release' || inputs.publish == true
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check Store credentials
        shell: pwsh
        env:
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
        run: |
          foreach ($key in @('AZURE_AD_TENANT_ID', 'SELLER_ID', 'AZURE_AD_APPLICATION_CLIENT_ID', 'AZURE_AD_APPLICATION_SECRET')) {
            if (-not [Environment]::GetEnvironmentVariable($key)) { throw "Missing GitHub Actions secret: $key. See docs/microsoft-store.md." }
          }
      - uses: actions/download-artifact@v4
        with:
          name: morganized-msix-${{ needs.build.outputs.version }}-x64
          path: package
      - uses: microsoft/microsoft-store-apppublisher@v1.1
      - name: Authenticate and submit package
        shell: pwsh
        env:
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
        run: |
          msstore reconfigure --tenantId "$env:AZURE_AD_TENANT_ID" --sellerId "$env:SELLER_ID" --clientId "$env:AZURE_AD_APPLICATION_CLIENT_ID" --clientSecret "$env:AZURE_AD_APPLICATION_SECRET"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          msstore publish "package/Morganized_${{ needs.build.outputs.version }}.0_x64.msix" -id 9P90C0SFQ4BZ
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
